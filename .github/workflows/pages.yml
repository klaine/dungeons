# Builds the site and writes the result to the gh-pages branch, which GitHub Pages serves.
# One-time setup: Settings > Pages > Source "Deploy from a branch", branch gh-pages, folder / (root).
name: Publish site

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

# One group per branch: a newer push to the default branch replaces a publish still running, but a push to any other branch,
# whose run is skipped, must not cancel it (one group for every branch did, and the site was left unpublished).
concurrency:
  group: publish-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Only the default branch is published, whatever it is called.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Write build to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No Jekyll processing; serve the files exactly as built.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          # The branch holds only the latest build, so it is replaced rather than appended to.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
