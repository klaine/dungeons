<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dungeons: walk the world</title>
  <style>
    /* One look over a three-dimensional scene: the sky behind the picture, dark glass panels over it. */
    :root {
      --sky: #9ab6cf;
      --panel: rgba(12, 11, 10, 0.66);
      --panel-edge: rgba(232, 226, 214, 0.35);
      --ink: #e8e2d6;
      --focus: #e0b070;
      --pressed: rgba(224, 176, 112, 0.45);
      --text: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { background: var(--sky); color: var(--ink); font: var(--text); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas#view { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hud, #hint, #menus select, #menus .box { color: var(--ink); background: var(--panel); border-radius: 6px; }
    #hud { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); padding: 8px 12px; white-space: pre; font-variant-numeric: tabular-nums; pointer-events: none; max-width: calc(100vw - 24px); overflow: hidden; }
    #hint { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 6px 10px; pointer-events: none; max-width: calc(100vw - 24px); transition: opacity .4s; }
    #hint .touch { display: none; }
    #menus { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: stretch; }
    #menus select { font: inherit; border: 1px solid var(--panel-edge); padding: 6px 8px; max-width: 46vw; }
    #menus .box { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--panel-edge); padding: 6px 10px; cursor: pointer; white-space: nowrap; }
    #menus .box input { margin: 0; width: 16px; height: 16px; accent-color: var(--focus); }
    #menus a.box { color: var(--focus); text-decoration: none; }
    #menus select:focus-visible, #menus .box:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }

    /* Touch: a stick where the left thumb lands, and buttons on the right (Up and Down only while flying). */
    #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 1.5px solid var(--panel-edge); background: rgba(11, 10, 9, .22); pointer-events: none; opacity: 0; transition: opacity .15s; }
    #stick.on { opacity: 1; }
    #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(232, 226, 214, .5); transition: background .15s; }
    #stick.run #knob { background: var(--focus); }
    .pad { display: none; position: fixed; width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--panel-edge); background: rgba(11, 10, 9, .32); color: var(--ink); font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; touch-action: none; -webkit-user-select: none; user-select: none; padding: 0; }
    .pad:active, .pad[aria-pressed="true"] { background: var(--pressed); }
    #fly { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 68px; height: 68px; font-size: 12px; }
    #up { right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
    #down { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
    #next { right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(180px + env(safe-area-inset-bottom, 0px)); }
    body.touch #fly, body.touch #next, body.touch.flying #up, body.touch.flying #down { display: block; }
    body.touch #hint { right: auto; left: calc(12px + env(safe-area-inset-left, 0px)); max-width: calc(100vw - 140px); }
    body.touch #hint .keys { display: none; }
    body.touch #hint .touch { display: inline; }
    body.touched #hint { opacity: 0; }

    @media (max-width: 640px) {
      #menus { left: calc(12px + env(safe-area-inset-left, 0px)); justify-content: flex-start; }
      #menus select { max-width: 44vw; }
      #hud { font-size: 10px; padding: 6px 9px; top: calc(98px + env(safe-area-inset-top, 0px)); }
      #hint { font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">Starting…</div>
  <div id="menus">
    <select id="worlds" aria-label="World"></select>
    <select id="where" aria-label="Go to"></select>
    <label class="box" title="Lay the ground near you at half a metre, with tussocks, stones and rills"><input type="checkbox" id="fine"> Half-metre ground</label>
    <a class="box" id="play" href="./index.html">Build a house here</a>
  </div>
  <div id="hint"><span class="keys">Click to look about · W A S D to move · Shift to run · V to fly (Space up, C down) · P next place · 1 to 4 a valley head, Shift+1 to 4 an island · M triangles</span><span class="touch">Left thumb to walk, push far to run · drag on the right to look · Fly, Up and Down · Next place</span></div>
  <script type="module" src="/src/worldwalk/main.ts"></script>
</body>
</html>
