<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeons: gallery</title>
  <style>
    html { background: #0b0a09; color: #e8e2d6; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0 auto; max-width: 1240px; padding: 20px 16px 60px; }
    h1 { margin: 0 0 4px; font: 600 17px/1.2 ui-serif, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; }
    header p { margin: 0 0 14px; max-width: 64ch; opacity: .78; }
    a { color: inherit; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 18px; }
    button, select { font: inherit; color: inherit; background: rgba(232, 226, 214, .08); cursor: pointer; border: 1px solid rgba(232, 226, 214, .35); border-radius: 4px; padding: 6px 12px; }
    button:hover { background: rgba(224, 176, 112, .35); }
    select option { color: #111; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 16px; }
    .card { display: block; text-decoration: none; border: 1px solid rgba(232, 226, 214, .18); border-radius: 6px; overflow: hidden; background: rgba(232, 226, 214, .04); }
    .card:hover, .card:focus-visible { border-color: #e0b070; outline: none; }
    .card canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    .card div { padding: 10px 12px 12px; }
    .card b { display: block; font: 600 14px/1.3 ui-serif, Georgia, serif; letter-spacing: .04em; }
    .card span { display: block; margin-top: 3px; font-size: 12.5px; opacity: .8; }
    .card i { display: block; margin-top: 6px; font-style: normal; font-size: 12px; opacity: .6; font-variant-numeric: tabular-nums; }
    #count { opacity: .6; }
  </style>
</head>
<body>
  <header>
    <h1>Dungeons: gallery</h1>
    <p>Places the generator makes, a dozen at a time. Each plan is drawn from its seed without building the place; choose one to walk through it.</p>
  </header>
  <nav>
    <button id="more" type="button">Another dozen</button>
    <label>Show <select id="want">
      <option value="">any place</option>
      <option value="court">with a court</option>
      <option value="cave">with a cave</option>
      <option value="gate">with a portcullis</option>
      <option value="secret">with a hidden chamber</option>
      <option value="fallen">with a fallen roof</option>
      <option value="small">small: seven rooms or fewer</option>
      <option value="large">large: ten rooms or more</option>
      <option value="island">islands, seen whole</option>
    </select></label>
    <span id="count"></span>
    <a href="./">The explorer</a>
    <a href="range.html">What the generator makes</a>
    <a href="examples/viewer/">Viewer for exports</a>
  </nav>
  <main id="grid"></main>
  <script type="module" src="/src/gallery/main.ts"></script>
</body>
</html>
