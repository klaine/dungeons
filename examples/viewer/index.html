<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14110e; color: #eadfc9; font: 14px/1.4 system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    @media (min-width: 800px) { canvas { position: fixed; left: 300px; width: calc(100% - 300px); } #panel { height: 100%; } }
    #panel { position: fixed; top: 0; left: 0; max-height: 100%; width: min(300px, 80vw); overflow: auto; box-sizing: border-box; padding: 12px 14px; background: rgba(20, 17, 14, 0.82); }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #b9ad97; }
    label { display: block; margin: 8px 0 2px; }
    input[type=file], input[type=range] { width: 100%; }
    ol { margin: 8px 0 0; padding-left: 22px; }
    li { cursor: pointer; padding: 1px 0; }
    li:hover { color: #fff; }
    #status { color: #e0a45c; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel">
    <h1 id="name">Site viewer</h1>
    <p id="title">Choose the model (.glb) and the site data (.json) exported from the same place, or drop both files on the page.</p>
    <label>Model and site data <input id="files" type="file" accept=".glb,.json" multiple></label>
    <label>Cut the building open at <span id="cutAt"></span> <input id="cut" type="range" min="0" max="1" step="0.05" value="0.5"></label>
    <label><input id="route" type="checkbox" checked> Show the solver's route</label>
    <p id="status"></p>
    <ol id="places"></ol>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
