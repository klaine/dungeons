<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Downhill Run</title>
  <meta name="claude:viewport-fit-sides" content="cover" />
  <style>
    /* A run down a groomed slope, watched: the picture fills the screen; what the skier is doing and how fast at the top left, the run's
       parts as a timeline along the foot with the controls over it. The labs' own dark sheet and brass, over bright snow, in both themes:
       a tool's single look, set explicitly. */
    :root {
      color-scheme: dark;
      --ground: #0b0a09;
      --sheet: rgba(11, 10, 9, .78);
      --chip: rgba(11, 10, 9, .6);
      --band: rgba(232, 226, 214, .12);
      --band-strong: rgba(232, 226, 214, .22);
      --ink: #e8e2d6;
      --ink-dim: rgba(232, 226, 214, .62);
      --rule: rgba(232, 226, 214, .2);
      --edge: rgba(232, 226, 214, .42);
      --brass: #e0b070;
      --brass-wash: rgba(224, 176, 112, .3);
      --on-brass: #1a1408;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --serif: ui-serif, Georgia, "Times New Roman", serif;
      --hit: 28px;
      --gutter-l: max(16px, env(safe-area-inset-left, 0px));
      --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    }
    @media (pointer: coarse) { :root { --hit: 34px; } }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--ground); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

    #where { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: var(--gutter-l); display: grid; gap: 2px; padding: 10px 14px 11px;
      background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; min-width: 0; max-width: calc(100vw - 32px); box-sizing: border-box; }
    #where .name { font: 600 11px/1.2 var(--serif); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
    #where .part { font: 600 20px/1.2 var(--sans); color: var(--ink); text-wrap: balance; }
    #where .numbers { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
    #where .numbers b { color: var(--ink); font-weight: 600; }

    #foot { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 8px;
      padding: 10px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
      background: linear-gradient(to top, var(--sheet) 60%, transparent); }
    #controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
    .group { display: flex; gap: 4px; align-items: center; }
    .group .label { font: 600 10px/1 var(--serif); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-right: 4px; }
    button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--edge); border-radius: 3px; padding: 2px 10px; min-height: var(--hit); cursor: pointer; touch-action: manipulation; }
    button:hover { border-color: var(--brass); }
    button:focus-visible, #line:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
    button.on { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
    #play { min-width: 74px; font-weight: 600; }

    #line { position: relative; height: 40px; border-radius: 3px; overflow: hidden; background: var(--chip); border: 1px solid var(--rule); cursor: pointer; touch-action: none; }
    #line .band { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--rule); background: var(--band); display: flex; align-items: center; padding: 0 6px; box-sizing: border-box; min-width: 0; }
    #line .band.now { background: var(--brass-wash); }
    #line .band span { font-size: 11px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #line .band.now span { color: var(--ink); }
    #line .head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--brass); pointer-events: none; }
    #line .ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; pointer-events: none;
      background-image: repeating-linear-gradient(to right, var(--band-strong) 0 1px, transparent 1px calc(100% / 44)); }
    @media (max-width: 640px) { #line .band span { display: none; } #where .part { font-size: 17px; } }

    #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink); font: 600 14px/1.4 var(--sans); background: var(--ground); }
    #status[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="A skier going down a groomed slope"></canvas>
  <div id="where" aria-live="polite">
    <div class="name">Downhill run</div>
    <div class="part" id="part">Long, wide turns</div>
    <div class="numbers"><span><b id="speed">0</b> km/h</span><span><b id="down">0</b> m down</span><span><b id="clock">0.0</b> s of 44</span></div>
  </div>
  <div id="foot">
    <div id="controls">
      <div class="group"><button id="play" type="button">Pause</button></div>
      <div class="group" id="rates"><span class="label">Speed</span></div>
      <div class="group" id="views"><span class="label">View</span></div>
    </div>
    <div id="line" tabindex="0" role="slider" aria-label="Where in the run" aria-valuemin="0" aria-valuemax="44" aria-valuenow="0"><div class="ticks"></div><div class="head"></div></div>
  </div>
  <div id="status">Making the run…</div>
  <script type="module" src="./slope.ts"></script>
</body>
</html>
