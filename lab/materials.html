<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Material lab</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; color: #e8e2d6;
      font: 12px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    #view { display: block; touch-action: none; }
    #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 248px; box-sizing: border-box; overflow-y: auto; padding: 10px 12px 14px;
      background: rgba(11, 10, 9, .78); border-left: 1px solid rgba(232, 226, 214, .18); scrollbar-width: thin; }
    body.bare #panel, body.bare #foot { display: none; }
    #panel h2 { margin: 12px 0 5px; font: 600 11px/1.2 ui-serif, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; color: #e0b070; }
    #panel h2:first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 74px 1fr 34px; gap: 2px 6px; align-items: center; min-height: 20px; }
    .row.wide { grid-template-columns: 74px 1fr; }
    .row label { opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row output { opacity: .65; text-align: right; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; margin: 0; accent-color: #e0b070; }
    select, button { font: inherit; color: inherit; background: rgba(11, 10, 9, .6); border: 1px solid rgba(232, 226, 214, .4); border-radius: 3px; padding: 1px 6px; }
    button { cursor: pointer; }
    button:hover, button.on { background: rgba(224, 176, 112, .35); }
    .buttons { display: flex; flex-wrap: wrap; gap: 4px; }
    .buttons button { flex: 1 1 auto; }
    .checks { display: flex; flex-wrap: wrap; gap: 2px 10px; }
    .checks label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .checks input { margin: 0; accent-color: #e0b070; }
    .note { opacity: .55; margin: 4px 0 0; }
    #foot { position: fixed; left: 12px; bottom: 10px; right: 262px; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
      font-variant-numeric: tabular-nums; white-space: pre-wrap; }
    #foot .dim { opacity: .62; }
    #foot .bad { color: #ff9a80; }
    #foot .good { color: #b9d99a; }
    /* The picture kept for comparison lies over the live one, and is cut off at the divider. */
    #kept { position: fixed; left: 0; top: 0; height: 100%; pointer-events: none; display: none; }
    #divider { position: fixed; top: 0; bottom: 0; width: 13px; margin-left: -6px; cursor: ew-resize; display: none; }
    #divider::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .8); box-shadow: 0 0 3px #000; }
    #divider::after { content: 'kept  |  now'; position: absolute; top: 8px; left: -35px; width: 84px; text-align: center; white-space: pre;
      background: rgba(11, 10, 9, .7); border-radius: 3px; padding: 1px 0; }
    body.comparing #kept, body.comparing #divider { display: block; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <img id="kept" alt="" />
  <div id="divider"></div>
  <div id="foot"></div>
  <div id="panel"></div>
  <script type="module" src="./materials.ts"></script>
</body>
</html>
