<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Dungeons Figure Lab</title>
  <style>
    /* A tool over a lit stage: the same dark look as the building lab, whatever the reader's theme. The picture fills the screen; the
       panel stands at its right, or along its foot on a narrow screen. */
    :root {
      color-scheme: dark;
      --ground: #0b0a09;
      --sheet: rgba(11, 10, 9, .88);
      --chip: rgba(11, 10, 9, .66);
      --ink: #e8e2d6;
      --ink-strong: #f2ead9;
      --rule: rgba(232, 226, 214, .2);
      --edge: rgba(232, 226, 214, .42);
      --brass: #e0b070;
      --brass-wash: rgba(224, 176, 112, .32);
      --on-brass: #1a1408;
      --shadow: rgba(0, 0, 0, .85);
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --serif: ui-serif, Georgia, "Times New Roman", serif;
      --hit: 22px;
    }
    @media (pointer: coarse) { :root { --hit: 32px; } }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--ground); color: var(--ink); font: 12px/1.45 var(--sans);
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    @media (pointer: coarse) { body { font-size: 13px; } }
    #view { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none; }
    #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 280px; box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      padding: calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) 16px;
      background: var(--sheet); border-left: 1px solid var(--rule); scrollbar-width: thin; }
    #panel h2 { margin: 16px 0 6px; font: 600 11px/1.2 var(--serif); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
    #panel h2:first-child { margin-top: 0; }
    #panel h3 { margin: 10px 0 3px; font: 600 1em/1.2 var(--sans); color: var(--ink-strong); }
    select, button { font: inherit; color: inherit; background: var(--chip); border: 1px solid var(--edge); border-radius: 3px; padding: 2px 8px; min-height: var(--hit); touch-action: manipulation; }
    button { cursor: pointer; }
    button:hover, button.on { background: var(--brass-wash); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
    .buttons button { flex: 1 1 auto; }
    .clips { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0 6px; }
    .clips button { padding: 1px 6px; font-size: 11px; min-height: calc(var(--hit) - 2px); }
    .who button.on { background: var(--brass); border-color: var(--brass); color: var(--on-brass); }
    .checks { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 3px 0; min-height: var(--hit); align-items: center; }
    .checks label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; min-height: var(--hit); }
    .checks input { margin: 0; accent-color: var(--brass); width: 16px; height: 16px; }
    .state { font-variant-numeric: tabular-nums; color: var(--ink-strong); min-height: 1.45em; }
    .note { opacity: .62; margin: 5px 0 0; }
    #foot { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: 10px; pointer-events: none; text-shadow: 0 1px 3px var(--shadow);
      font-variant-numeric: tabular-nums; white-space: pre-wrap; }
    #foot .dim { opacity: .62; }
    @media (max-width: 720px) {
      #panel { top: auto; left: 0; width: auto; height: 42vh; border-left: 0; border-top: 1px solid var(--rule);
        padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
      #foot .dim { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="view" tabindex="0"></canvas>
  <div id="foot">Loading the figures…</div>
  <div id="panel"></div>
  <script type="module" src="./figures.ts"></script>
</body>
</html>
