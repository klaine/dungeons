<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Dungeons</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; color: #e8e2d6;
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; }
    #view { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
    #hud { position: fixed; left: 18px; bottom: 16px; right: 18px; pointer-events: none;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }
    #hud h1 { margin: 0 0 2px; font: 600 15px/1.2 ui-serif, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; }
    #stats, #fps { opacity: .62; font-variant-numeric: tabular-nums; }
    #hint { text-align: right; opacity: .8; transition: opacity .4s; }
    body.walking #hint .idle { display: none; }
    body:not(.walking) #hint .active { display: none; }
    #hint .touch { display: none; }

    /* Touch: the bottom corners belong to thumbs, so the readout moves to the top. */
    body.touch #hud { bottom: auto; top: calc(34px + env(safe-area-inset-top)); align-items: flex-start;
      left: calc(18px + env(safe-area-inset-left)); right: calc(18px + env(safe-area-inset-right)); }
    body.touch #stats { max-width: 52vw; }
    body.touch #hint .idle, body.touch #hint .active { display: none; }
    body.touch #hint .touch { display: block; }
    body.touched #hint { opacity: 0; }
    #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
      border: 1.5px solid rgba(232, 226, 214, .38); background: rgba(11, 10, 9, .22);
      pointer-events: none; opacity: 0; transition: opacity .15s; }
    #stick.on { opacity: 1; }
    #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%; background: rgba(232, 226, 214, .5); transition: background .15s; }
    #stick.run #knob { background: #e0b070; }
    #jump { display: none; position: fixed; right: calc(22px + env(safe-area-inset-right));
      bottom: calc(26px + env(safe-area-inset-bottom)); width: 68px; height: 68px; border-radius: 50%;
      border: 1.5px solid rgba(232, 226, 214, .38); background: rgba(11, 10, 9, .28); color: #e8e2d6;
      font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
      touch-action: none; -webkit-user-select: none; user-select: none; }
    #jump:active { background: rgba(224, 176, 112, .45); }
    body.touch #jump { display: block; }
    kbd { font: inherit; padding: 0 5px; border: 1px solid rgba(232, 226, 214, .4); border-radius: 3px; }
    #progress { position: fixed; top: 0; left: 0; right: 0; pointer-events: none; }
    #bar { height: 2px; background: #e0b070; transform-origin: 0 50%; transform: scaleX(0); transition: transform .2s linear; }
    #status { padding: 8px 18px; opacity: .85; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="progress"><div id="bar"></div><div id="status">Starting</div></div>
  <div id="hud">
    <div>
      <h1>Dungeons</h1>
      <div id="stats"></div>
      <div id="fps"></div>
    </div>
    <div id="hint">
      <div class="idle">Click to walk</div>
      <div class="touch">Drag on the left to move, push further to run · drag on the right to look</div>
      <div class="active"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump · <kbd>F</kbd> fog · <kbd>B</kbd> baked light · <kbd>Esc</kbd> release</div>
    </div>
  </div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
